# Publish to PyPI when a GitHub release is published.
#
# Uses trusted publishing, so there is no API token in repository secrets --
# PyPI verifies the workflow's identity directly. One-time setup on PyPI:
#   Project -> Publishing -> Add a new pending publisher
#     Owner: <your github user>   Repository: callwitness
#     Workflow: release.yml       Environment: pypi
#
# The distribution name comes from pyproject.toml, so this works whatever the
# project ends up being called.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Never ship something the tests have not seen
        run: |
          pip install -e ".[dev]"
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
