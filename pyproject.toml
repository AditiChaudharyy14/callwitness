[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bollard"
version = "0.1.0"
description = "Record every tool call an AI agent makes. Block nothing."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Aditi Chaudhary" }]
keywords = ["ai", "agents", "mcp", "security", "observability", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bollard = "bollard.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/AditiChaudharyy14/bollard"
Source = "https://github.com/AditiChaudharyy14/bollard"

[tool.hatch.build.targets.wheel]
packages = ["src/bollard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs that spawn processes"]
